<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Perpustakaan Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Panel Admin</h1>
        <p id="sapaan">Memeriksa akses...</p>
    </header>

    <main>
        <button id="keluar" class="tombol">Keluar</button>

        <section class="form-kartu form-lebar">
            <h2 id="judul-form">Tambah Buku</h2>
            <form id="form-buku">
                <label for="judul">Judul *</label>
                <input type="text" id="judul" required>

                <label for="pengarang">Pengarang</label>
                <input type="text" id="pengarang">

                <label for="penerbit">Penerbit</label>
                <input type="text" id="penerbit">

                <label for="tahun">Tahun terbit</label>
                <input type="number" id="tahun" min="1000" max="2100">

                <label for="isbn">ISBN</label>
                <input type="text" id="isbn">

                <label for="bahasa">Bahasa</label>
                <select id="bahasa"></select>

                <label for="subjek">Subjek</label>
                <input type="text" id="subjek">

                <label for="ddc">Nomor DDC</label>
                <input type="text" id="ddc">

                <label for="deskripsi">Deskripsi</label>
                <textarea id="deskripsi" rows="4"></textarea>

                <label for="file-url">Tautan file (URL)</label>
                <input type="url" id="file-url">

                <label for="status">Status</label>
                <select id="status">
                    <option value="draft">Draft (belum tampil di katalog)</option>
                    <option value="terbit">Terbit (tampil di katalog)</option>
                </select>

                <button type="submit" class="tombol" id="tombol-simpan">Simpan Buku</button>
                <button type="button" class="tombol-kecil" id="batal-edit" hidden>Batal</button>
                <p id="pesan-form"></p>
            </form>
        </section>

        <section class="bagian-daftar">
            <h2>Semua Koleksi</h2>
            <div id="daftar-admin"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
